name: Update profile art

"on":
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  profile-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/profile-cards
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: Sakthivel-P-cse
          cards: contributions,languages
          layout: split
          output-dir: assets/profile-cards
          themes: light,dark
          palette: purple
          commit: true
